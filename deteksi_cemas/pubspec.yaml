name: deteksi_cemas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Provides core localization logic
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  font_awesome_flutter: ^10.6.0
  intl: ^0.20.2
  lottie: ^3.1.0
  google_sign_in: ^6.2.1
  http: ^1.1.0
  flutter_secure_storage: ^8.0.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.3
  mqtt_client: ^10.2.0
  just_audio: ^0.9.40
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  path: ^1.9.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true # This tells Flutter to auto-generate the translation code
  uses-material-design: true
  assets:
    - "assets/images/onboarding_welcome.png"
    - "assets/images/onboarding_heartbeat.png"
    - "assets/images/onboarding_survey.png"
    - "assets/images/onboarding_history.png"
    - "assets/images/onboarding_explore.png"
    - "assets/images/jogging.jpg"
    - "assets/images/food.jpg"
    - "assets/images/heartbeat_image.png"
    - "assets/animation/heartbeat_animation.json"
    - "assets/audio/heartbeat_sample.wav"
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/deteksi_cemas.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF" # Background color for Android adaptive icons
  adaptive_icon_foreground: "assets/images/deteksi_cemas.png" # The logo itself